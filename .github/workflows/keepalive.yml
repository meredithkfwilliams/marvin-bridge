name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no commits to
# the repo. This job pushes a trivial commit every few weeks so the Marvin
# sync schedule (and this one) never goes quiet long enough to trip that.
on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp
        run: echo "Last keepalive run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/KEEPALIVE.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE.md
          git diff --cached --quiet || git commit -m "chore: keepalive"
          git push
